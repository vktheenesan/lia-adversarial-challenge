name: LIA Sovereign Formal Assurance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify Invariants & Attack Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run NASA JPL Power of 10 Formal Audit
      run: python3 challenge_runner.py --jpl

    - name: Run NIST SAMATE Juliet CWE Elimination Suite
      run: python3 challenge_runner.py --cwe

    - name: Run 10-Level Adversarial Attack Ladder
      run: python3 challenge_runner.py --ladder

    - name: Run High-Throughput Endurance Benchmark
      run: python3 challenge_runner.py --bench

    - name: Test Sample Custom Payloads
      run: |
        python3 challenge_runner.py --custom attacks/custom_payloads/sample_cwe120_overflow.bin
        python3 challenge_runner.py --custom attacks/custom_payloads/sample_polyglot_sqli.txt
        python3 challenge_runner.py --custom attacks/custom_payloads/sample_modbus_tamper.json
